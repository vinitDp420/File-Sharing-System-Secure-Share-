services:
  # ── Backend Express API Service ──
  - type: web
    name: secureshare-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    rootDir: backend
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: secureshare-ml
          property: url

  # ── Python ML Analytics & Prediction Service ──
  - type: web
    name: secureshare-ml
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: ml-service
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # ── Vite React Frontend Static Site ──
  - type: web
    name: secureshare-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://secureshare-backend.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://secureshare-backend.onrender.com

  # ── Distributed Node Simulators (Optional) ──
  - type: web
    name: secureshare-node-1
    env: node
    buildCommand: npm install
    startCommand: node server.js
    rootDir: node-simulator
    envVars:
      - key: NODE_ID
        value: N001
      - key: REGION
        value: us-east

  - type: web
    name: secureshare-node-2
    env: node
    buildCommand: npm install
    startCommand: node server.js
    rootDir: node-simulator
    envVars:
      - key: NODE_ID
        value: N002
      - key: REGION
        value: us-west

  - type: web
    name: secureshare-node-3
    env: node
    buildCommand: npm install
    startCommand: node server.js
    rootDir: node-simulator
    envVars:
      - key: NODE_ID
        value: N003
      - key: REGION
        value: eu-central
